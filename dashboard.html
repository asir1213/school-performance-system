<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بَصيرة – نظام تقويم أداء المدارس</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome.com/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:#f3f6fb}
.topbar{height:72px;background:#0d47a1;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.layout{display:flex}
.sidebar{width:260px;background:#0b3c91;min-height:calc(100vh - 72px);padding-top:15px}
.sidebar a{display:flex;align-items:center;gap:12px;padding:15px 22px;color:#fff;text-decoration:none;font-size:16px;cursor:pointer}
.sidebar a.active,.sidebar a:hover{background:#1565c0;border-right:5px solid #ffeb3b}
.content{flex:1;padding:25px}
.section{display:none}
.section.active{display:block}

.upload-form input,.upload-form select,.upload-form textarea{
  width:100%;padding:10px;margin-bottom:12px;
  border-radius:6px;border:1px solid #ccc;font-size:14px
}
.dropzone{
  border:2px dashed #0d47a1;
  padding:30px;text-align:center;
  border-radius:10px;color:#555;margin-bottom:15px
}
.dropzone:hover{background:#e3f2fd}
button.main{
  background:#0d47a1;color:#fff;border:none;
  padding:10px 22px;border-radius:6px;cursor:pointer
}

.report-cards{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px
}
.report-card{
  background:#fff;padding:20px;border-radius:12px;
  box-shadow:0 4px 8px rgba(0,0,0,.08);
  text-align:center
}

.ai-box{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:20px
}
.ai-card{
  background:#fff;padding:20px;border-radius:12px;
  text-align:center;cursor:pointer;
  box-shadow:0 4px 8px rgba(0,0,0,.08)
}
.chat textarea{width:100%;height:90px;padding:10px;border-radius:8px;border:1px solid #ccc}
.chat button{margin-top:10px}
</style>
</head>

<body>

<div class="topbar">بَصيرة – نظام تقويم أداء المدارس</div>

<div class="layout">
<div class="sidebar">
  <a class="active" onclick="showSection('upload',this)"><i class="fa fa-upload"></i> رفع دليل</a>
  <a onclick="showSection('reports',this)"><i class="fa fa-file-alt"></i> التقارير</a>
  <a onclick="showSection('assistant',this)"><i class="fa fa-robot"></i> المساعد الذكي</a>
</div>

<div class="content">

<!-- Upload -->
<div id="upload" class="section active">
<h2>رفع دليل جديد</h2>

<div class="upload-form">
  <input placeholder="عنوان الدليل">
  <textarea placeholder="وصف الدليل"></textarea>

  <select>
    <option>اختر القسم</option>
    <option>الرياضيات</option>
    <option>العلوم</option>
    <option>اللغة العربية</option>
    <option>المختبرات</option>
    <option>الابتكار</option>
  </select>

  <select>
    <option>اختر المجال</option>
    <option>الإنجاز الدراسي</option>
    <option>النمو الشخصي</option>
    <option>التدريس والتقويم</option>
    <option>مناخ المدرسة</option>
    <option>القيادة والحوكمة</option>
  </select>

  <div class="dropzone">اسحب الملف هنا أو اضغط للاختيار (جميع الملفات مدعومة)</div>

  <input placeholder="أو ضع رابط الدليل (اختياري)">
  <button class="main">حفظ الدليل</button>
</div>
</div>

<!-- Reports -->
<div id="reports" class="section">
<h2>التقارير</h2>
<div class="report-cards">
  <div class="report-card">📊 إجمالي الأدلة<br><strong>148</strong></div>
  <div class="report-card">✅ المعتمدة<br><strong>82</strong></div>
  <div class="report-card">⏳ قيد المراجعة<br><strong>44</strong></div>
</div>
</div>

<!-- Assistant -->
<div id="assistant" class="section">
<h2>المساعد الذكي</h2>
<div class="ai-box">
  <div class="ai-card">✍️ كتابة عبارة تقييمية</div>
  <div class="ai-card">📊 تحليل دليل</div>
  <div class="ai-card">🎯 اقتراح تطوير</div>
</div>
<div class="chat">
  <textarea placeholder="اكتب سؤالك هنا..."></textarea>
  <button class="main">إرسال</button>
</div>
</div>

</div>
</div>

<script>
function showSection(id,el){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
  el.classList.add('active');
}
</script>

</body>
</html>
