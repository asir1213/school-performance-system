<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بَصيرة – نظام تقويم أداء المدارس</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:#f3f6fb}
.topbar{height:72px;background:#0d47a1;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.layout{display:flex}
.sidebar{width:270px;background:#0b3c91;min-height:calc(100vh - 72px);padding-top:15px}
.sidebar a{display:flex;align-items:center;gap:12px;padding:15px 22px;color:#fff;text-decoration:none;font-size:16px;cursor:pointer}
.sidebar a.active,.sidebar a:hover{background:#1565c0;border-right:5px solid #ffeb3b}
.content{flex:1;padding:25px}
.section{display:none}
.section.active{display:block}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:25px}
.card{background:#fff;padding:20px;border-radius:12px;text-align:center;box-shadow:0 4px 8px rgba(0,0,0,.08)}
.card h3{margin:0;font-size:26px}
.green{color:#2e7d32}.gold{color:#f9a825}.red{color:#c62828}

.filters{display:flex;gap:15px;margin-bottom:15px}
.filters input,.filters select{padding:10px;border-radius:6px;border:1px solid #ccc}

.evidence-list{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.evidence-card{background:#fff;padding:15px;border-radius:10px;box-shadow:0 3px 6px rgba(0,0,0,.08)}
.status{font-weight:600}
.approved{color:#2e7d32}.pending{color:#f9a825}.rejected{color:#c62828}

.upload-form input,.upload-form textarea,.upload-form select{
  width:100%;padding:10px;margin-bottom:12px;border-radius:6px;border:1px solid #ccc
}
.dropzone{border:2px dashed #0d47a1;padding:25px;text-align:center;border-radius:10px;color:#555}

button.main{background:#0d47a1;color:#fff;border:none;padding:10px 22px;border-radius:6px;cursor:pointer}
</style>
</head>

<body>

<div class="topbar">بَصيرة – نظام تقويم أداء المدارس</div>

<div class="layout">
<div class="sidebar">
  <a class="active" onclick="showSection('dashboard',this)"><i class="fa fa-home"></i> لوحة التحكم</a>
  <a onclick="showSection('evidence',this)"><i class="fa fa-folder-open"></i> الأدلة</a>
  <a onclick="showSection('upload',this)"><i class="fa fa-upload"></i> رفع دليل</a>
  <a onclick="showSection('reports',this)"><i class="fa fa-chart-pie"></i> التقارير</a>
</div>

<div class="content">

<!-- Dashboard -->
<div id="dashboard" class="section active">
<h2>لوحة التحكم</h2>
<div class="cards">
  <div class="card"><h3 id="totalCount">0</h3><span>إجمالي الأدلة</span></div>
  <div class="card green"><h3 id="approvedCount">0</h3><span>المعتمدة</span></div>
  <div class="card gold"><h3 id="pendingCount">0</h3><span>قيد المراجعة</span></div>
  <div class="card red"><h3 id="rejectedCount">0</h3><span>المرفوضة</span></div>
</div>
</div>

<!-- Evidence -->
<div id="evidence" class="section">
<h2>الأدلة</h2>
<div class="filters">
  <input id="searchInput" placeholder="بحث بعنوان الدليل">
  <select id="statusFilter">
    <option value="">كل الحالات</option>
    <option value="معتمدة">معتمدة</option>
    <option value="قيد المراجعة">قيد المراجعة</option>
    <option value="مرفوضة">مرفوضة</option>
  </select>
</div>
<div class="evidence-list" id="evidenceList"></div>
</div>

<!-- Upload -->
<div id="upload" class="section">
<h2>رفع دليل</h2>
<div class="upload-form">
  <input id="titleInput" placeholder="عنوان الدليل">
  <textarea id="descInput" placeholder="وصف الدليل"></textarea>

  <select id="deptSelect"><option value="">اختر القسم</option></select>
  <select id="domainSelect"><option value="">اختر المجال</option></select>

  <div class="dropzone">سحب وإفلات أو اختيار ملف (أي نوع)</div>
  <input id="linkInput" placeholder="أو رابط الدليل (اختياري)">

  <button class="main" onclick="saveEvidence()">حفظ الدليل</button>
</div>
</div>

<!-- Reports -->
<div id="reports" class="section">
<h2>التقارير</h2>
<p>يتم تحديث الأرقام تلقائيًا من الأدلة المرفوعة.</p>
</div>

</div>
</div>

<script>
function showSection(id,el){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
  el.classList.add('active');
}

/* بيانات */
const departments=["الرياضيات","العلوم","اللغة العربية","اللغة الإنجليزية","التربية الإسلامية","الدراسات الاجتماعية","تقنية المعلومات","المختبرات","الموسيقى","الفنون","الابتكار","الأنشطة","التوجيه المهني","مصادر التعلم","شؤون الطلاب","الإدارة المدرسية"];
const domains=["الإنجاز الدراسي","النمو الشخصي","التدريس والتقويم","مناخ المدرسة","القيادة والحوكمة"];

departments.forEach(d=>deptSelect.add(new Option(d,d)));
domains.forEach(d=>domainSelect.add(new Option(d,d)));

let evidences=[];

/* حفظ دليل */
function saveEvidence(){
  const ev={
    title:titleInput.value,
    desc:descInput.value,
    dept:deptSelect.value,
    domain:domainSelect.value,
    status:"قيد المراجعة"
  };
  evidences.push(ev);
  renderEvidence();
  updateDashboard();
  alert("تم حفظ الدليل بنجاح");
}

/* عرض الأدلة */
function renderEvidence(){
  evidenceList.innerHTML="";
  evidences.forEach(ev=>{
    const card=document.createElement("div");
    card.className="evidence-card";
    card.innerHTML=`
      <h4>${ev.title}</h4>
      <p>${ev.desc}</p>
      <small>${ev.dept} | ${ev.domain}</small>
      <div class="status pending">${ev.status}</div>
    `;
    evidenceList.appendChild(card);
  });
}

/* تحديث لوحة التحكم */
function updateDashboard(){
  totalCount.textContent=evidences.length;
  approvedCount.textContent=evidences.filter(e=>e.status=="معتمدة").length;
  pendingCount.textContent=evidences.filter(e=>e.status=="قيد المراجعة").length;
  rejectedCount.textContent=evidences.filter(e=>e.status=="مرفوضة").length;
}
</script>

</body>
</html>
