<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بَصْرَة | لوحة التحكم</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Tahoma", Arial;
      background: #f4f6f9;
    }

    header {
      background: #1e3a8a;
      color: white;
      padding: 16px 30px;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      padding: 25px;
    }

    /* بطاقات الإحصائيات */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .stat-card h3 {
      margin: 0;
      color: #555;
      font-size: 15px;
    }

    .stat-card span {
      display: block;
      margin-top: 10px;
      font-size: 32px;
      font-weight: bold;
      color: #1e3a8a;
    }

    /* الرسوم */
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .chart-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .chart-box h4 {
      margin-bottom: 15px;
      color: #333;
    }

    /* قائمة جانبية */
    .sidebar {
      position: fixed;
      top: 70px;
      right: 0;
      width: 220px;
      height: 100%;
      background: #ffffff;
      border-left: 1px solid #ddd;
      padding-top: 20px;
    }

    .sidebar a {
      display: block;
      padding: 15px 20px;
      color: #1e3a8a;
      text-decoration: none;
      font-weight: bold;
    }

    .sidebar a:hover {
      background: #f1f5ff;
    }

    .main {
      margin-right: 240px;
    }
  </style>
</head>

<body>

<header>
  بَصْرَة – نظام تقويم أداء المدارس | لوحة التحكم
</header>

<div class="sidebar">
  <a href="dashboard.html">لوحة التحكم</a>
  <a href="upload.html">رفع دليل</a>
  <a href="evidence.html">عرض الأدلة</a>
  <a href="reports.html">التقارير</a>
</div>

<div class="main container">

  <!-- الإحصائيات -->
  <div class="stats">
    <div class="stat-card">
      <h3>إجمالي الأدلة</h3>
      <span>120</span>
    </div>
    <div class="stat-card">
      <h3>قيد المراجعة</h3>
      <span style="color:#d97706">35</span>
    </div>
    <div class="stat-card">
      <h3>المعتمدة</h3>
      <span style="color:#16a34a">70</span>
    </div>
    <div class="stat-card">
      <h3>المرفوضة</h3>
      <span style="color:#dc2626">15</span>
    </div>
  </div>

  <!-- الرسوم -->
  <div class="charts">

    <div class="chart-box">
      <h4>حالة الأدلة</h4>
      <canvas id="statusChart"></canvas>
    </div>

    <div class="chart-box">
      <h4>الأدلة حسب المجالات</h4>
      <canvas id="domainChart"></canvas>
    </div>

  </div>

</div>

<script>
  // رسم دائري
  new Chart(document.getElementById('statusChart'), {
    type: 'pie',
    data: {
      labels: ['معتمدة', 'قيد المراجعة', 'مرفوضة'],
      datasets: [{
        data: [70, 35, 15],
        backgroundColor: ['#16a34a', '#d97706', '#dc2626']
      }]
    }
  });

  // رسم طولي
  new Chart(document.getElementById('domainChart'), {
    type: 'bar',
    data: {
      labels: [
        'الإنجاز الدراسي',
        'النمو الشخصي',
        'التدريس والتقويم',
        'مناخ المدرسة',
        'القيادة والحوكمة'
      ],
      datasets: [{
        label: 'نسبة الإتقان %',
        data: [80, 75, 70, 85, 78],
        backgroundColor: '#1e3a8a'
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true,
          max: 100
        }
      }
    }
  });
</script>

</body>
</html>
