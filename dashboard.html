<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بَصيرة – نظام تقويم أداء المدارس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:#f3f6fb}
.topbar{height:72px;background:#0d47a1;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.layout{display:flex}
.sidebar{width:270px;background:#0b3c91;min-height:calc(100vh - 72px);padding-top:15px}
.sidebar a{display:block;padding:15px 22px;color:#fff;text-decoration:none;cursor:pointer}
.sidebar a.active,.sidebar a:hover{background:#1565c0;border-right:5px solid #ffeb3b}
.content{flex:1;padding:25px}
.section{display:none}
.section.active{display:block}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{background:#fff;padding:20px;border-radius:12px;text-align:center}
.green{color:#2e7d32}.gold{color:#f9a825}.red{color:#c62828}

.filters{display:flex;gap:15px;margin-bottom:15px}
.filters input,.filters select{padding:10px;border-radius:6px;border:1px solid #ccc}

.evidence-list{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.evidence-card{background:#fff;padding:15px;border-radius:10px}
.status{font-weight:600}

.upload-form select,.upload-form input,.upload-form textarea{
  width:100%;padding:10px;margin-bottom:12px;border-radius:6px;border:1px solid #ccc
}

button{background:#0d47a1;color:#fff;border:none;padding:10px 22px;border-radius:6px;cursor:pointer}
</style>
</head>

<body>

<div class="topbar">بَصيرة – نظام تقويم أداء المدارس</div>

<div class="layout">

<div class="sidebar">
  <a class="active" onclick="showSection('dashboard',this)">لوحة التحكم</a>
  <a onclick="showSection('evidence',this)">الأدلة</a>
  <a onclick="showSection('upload',this)">رفع دليل</a>
</div>

<div class="content">

<!-- Dashboard -->
<div id="dashboard" class="section active">
<h2>لوحة التحكم</h2>
<div class="cards">
  <div class="card"><h3 id="total">0</h3>إجمالي الأدلة</div>
  <div class="card green"><h3 id="approved">0</h3>المعتمدة</div>
  <div class="card gold"><h3 id="pending">0</h3>قيد المراجعة</div>
  <div class="card red"><h3 id="rejected">0</h3>المرفوضة</div>
</div>
</div>

<!-- Evidence -->
<div id="evidence" class="section">
<h2>عرض الأدلة</h2>

<div class="filters">
  <input id="search" placeholder="بحث">
  <select id="deptFilter"></select>
</div>

<div class="evidence-list" id="evidenceList"></div>
</div>

<!-- Upload -->
<div id="upload" class="section">
<h2>رفع دليل</h2>
<div class="upload-form">
  <input id="title" placeholder="عنوان الدليل">
  <textarea id="desc" placeholder="وصف الدليل"></textarea>

  <select id="deptSelect"></select>
  <select id="domainSelect"></select>
  <select id="criteriaSelect" disabled></select>
  <select id="indicatorSelect" disabled></select>

  <button onclick="saveEvidence()">حفظ الدليل</button>
</div>
</div>

</div>
</div>

<script>
function showSection(id,el){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
  el.classList.add('active');
}

/* الأقسام */
const departments=[
"الرياضيات","العلوم","اللغة العربية","اللغة الإنجليزية","التربية الإسلامية",
"الدراسات الاجتماعية","تقنية المعلومات","المختبرات","الموسيقى","الفنون",
"الابتكار وريادة الأعمال","الأنشطة الطلابية","التوجيه المهني","مصادر التعلم",
"شؤون الطلاب","الإدارة المدرسية"
];

/* المجالات ← المعايير ← المؤشرات */
const framework={
"الإنجاز الدراسي":{
  "التحصيل الدراسي":["نسب النجاح","تحليل النتائج"],
  "التقدم الدراسي":["مقارنة الأداء","خطط تحسين"]
},
"النمو الشخصي":{
  "القيم والسلوك":["الانضباط","المواطنة"],
  "الابتكار":["المشاريع","المبادرات"]
},
"التدريس والتقويم":{
  "تخطيط الدروس":["خطط","تحضير"],
  "التقويم":["اختبارات","تقويم تكويني"]
}
};

const deptSelect=document.getElementById("deptSelect");
const deptFilter=document.getElementById("deptFilter");
departments.forEach(d=>{
  deptSelect.add(new Option(d,d));
  deptFilter.add(new Option(d,d));
});

const domainSelect=document.getElementById("domainSelect");
const criteriaSelect=document.getElementById("criteriaSelect");
const indicatorSelect=document.getElementById("indicatorSelect");

Object.keys(framework).forEach(d=>domainSelect.add(new Option(d,d)));

domainSelect.onchange=()=>{
  criteriaSelect.innerHTML="";
  indicatorSelect.innerHTML="";
  criteriaSelect.disabled=false;
  indicatorSelect.disabled=true;
  Object.keys(framework[domainSelect.value]).forEach(c=>{
    criteriaSelect.add(new Option(c,c));
  });
};

criteriaSelect.onchange=()=>{
  indicatorSelect.innerHTML="";
  indicatorSelect.disabled=false;
  framework[domainSelect.value][criteriaSelect.value].forEach(i=>{
    indicatorSelect.add(new Option(i,i));
  });
};

let evidences=[];

function saveEvidence(){
  evidences.push({
    title:title.value,
    desc:desc.value,
    dept:deptSelect.value,
    domain:domainSelect.value,
    criteria:criteriaSelect.value,
    indicator:indicatorSelect.value,
    status:"قيد المراجعة"
  });
  renderEvidence();
  updateDashboard();
  alert("تم حفظ الدليل");
}

function renderEvidence(){
  evidenceList.innerHTML="";
  evidences.forEach(e=>{
    evidenceList.innerHTML+=`
    <div class="evidence-card">
      <h4>${e.title}</h4>
      <p>${e.desc}</p>
      <small>${e.dept} | ${e.domain}</small>
      <div class="status gold">${e.status}</div>
    </div>`;
  });
}

function updateDashboard(){
  total.textContent=evidences.length;
  pending.textContent=evidences.filter(e=>e.status=="قيد المراجعة").length;
  approved.textContent=0;
  rejected.textContent=0;
}
</script>

</body>
</html>
