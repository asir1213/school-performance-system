<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بَصْرَة | رفع دليل</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Tahoma,Arial;
  background:#f4f6f9;
}
header{
  background:#1e3a8a;
  color:#fff;
  padding:18px 30px;
  font-size:22px;
  font-weight:bold;
}
.container{
  padding:25px;
  max-width:900px;
  margin:auto;
}
.card{
  background:#fff;
  padding:25px;
  border-radius:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}
.field{
  margin-bottom:18px;
}
.field label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}
.field input,
.field textarea,
.field select{
  width:100%;
  padding:10px;
  border-radius:6px;
  border:1px solid #ccc;
}
textarea{resize:vertical}

.upload-box{
  border:2px dashed #1e3a8a;
  padding:25px;
  text-align:center;
  border-radius:10px;
  color:#555;
  margin-bottom:15px;
}

button{
  background:#1e3a8a;
  color:#fff;
  border:none;
  padding:12px 25px;
  border-radius:8px;
  font-size:15px;
  cursor:pointer;
}
button:hover{background:#162d6a}
</style>
</head>

<body>

<header>
بَصْرَة – رفع دليل
</header>

<div class="container">
<div class="card">

<div class="field">
<label>عنوان الدليل</label>
<input type="text" placeholder="مثال: خطة قسم الرياضيات">
</div>

<div class="field">
<label>وصف الدليل</label>
<textarea rows="3" placeholder="اكتب وصفًا مختصرًا للدليل"></textarea>
</div>

<div class="field">
<label>المجال</label>
<select id="domain">
<option value="">اختر المجال</option>
<option value="achievement">الإنجاز الدراسي</option>
<option value="growth">النمو الشخصي</option>
<option value="teaching">التدريس والتقويم</option>
<option value="environment">مناخ المدرسة وبيئة التعلم</option>
<option value="leadership">القيادة والإدارة والحوكمة</option>
</select>
</div>

<div class="field">
<label>المعيار</label>
<select id="standard" disabled>
<option value="">اختر المعيار</option>
</select>
</div>

<div class="field">
<label>المؤشر</label>
<select id="indicator" disabled>
<option value="">اختر المؤشر</option>
</select>
</div>

<div class="upload-box">
اسحب الملف هنا أو اضغط للاختيار  
<br>
<small>PDF – Word – صور – فيديو</small>
</div>

<button>حفظ الدليل</button>

</div>
</div>

<script>
const standards={
achievement:["التحصيل الدراسي","التقدم الدراسي","مهارات التعلم"],
growth:["الابتكار وريادة الأعمال","الوعي الصحي والبيئي","القيم والسلوك"],
teaching:["تخطيط المناهج","إدارة الصف","فاعلية التدريس","تعزيز مهارات التعلم","التقويم ومساندة التعلم"],
environment:["جودة بيئة التعلم","تعزيز المواهب","الدعم والرعاية","تنمية مهارات البحث"],
leadership:["الحوكمة","الشراكة المجتمعية","الكفاءة الإدارية","قيادة التعليم","قيادة التغيير"]
};

const indicators={
"التحصيل الدراسي":["نتائج الاختبارات","تحليل النتائج"],
"التقدم الدراسي":["تحسن مستوى الطلبة"],
"مهارات التعلم":["التفكير الناقد"],
"الابتكار وريادة الأعمال":["مشاريع طلابية"],
"الوعي الصحي والبيئي":["مبادرات مدرسية"]
};

domain.onchange=()=>{
standard.innerHTML='<option>اختر المعيار</option>';
indicator.innerHTML='<option>اختر المؤشر</option>';
indicator.disabled=true;
if(!domain.value)return;
standards[domain.value].forEach(s=>{
standard.innerHTML+=`<option>${s}</option>`;
});
standard.disabled=false;
};

standard.onchange=()=>{
indicator.innerHTML='<option>اختر المؤشر</option>';
if(!indicators[standard.value])return;
indicators[standard.value].forEach(i=>{
indicator.innerHTML+=`<option>${i}</option>`;
});
indicator.disabled=false;
};
</script>

</body>
</html>
