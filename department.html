<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بصرة | عرض الأدلة</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Tahoma,Arial;
  background:#f4f6f9;
}
header{
  background:#1e3a8a;
  color:#fff;
  padding:18px 30px;
  font-size:20px;
  font-weight:bold;
}

.main{
  padding:25px;
}

/* الفلاتر */
.filters{
  background:#fff;
  padding:15px;
  border-radius:12px;
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}

.filters input,
.filters select{
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;
}

/* البطاقات */
.cards{
  margin-top:25px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:18px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}

.card h4{
  margin:0 0 8px 0;
}

.card p{
  font-size:14px;
  color:#555;
}

.status{
  margin:10px 0;
  font-size:13px;
  font-weight:bold;
}

.approved{color:#16a34a;}
.pending{color:#d97706;}
.rejected{color:#dc2626;}

/* الأزرار */
.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.actions button{
  flex:1;
  padding:8px;
  border:none;
  border-radius:6px;
  color:#fff;
  font-size:13px;
  cursor:pointer;
}
.view{background:#2563eb;}
.review{background:#d97706;}
.edit{background:#059669;}
.delete{background:#dc2626;}
</style>
</head>

<body>

<header>
بصرة – عرض وإدارة الأدلة
</header>

<div class="main">

<!-- الفلاتر -->
<div class="filters">
  <input type="text" placeholder="🔍 بحث باسم الدليل">
  
  <select>
    <option>جميع المجالات</option>
    <option>الإنجاز الدراسي</option>
    <option>النمو الشخصي</option>
    <option>التدريس والتقويم</option>
    <option>مناخ المدرسة</option>
    <option>القيادة والحوكمة</option>
  </select>

  <select>
    <option>جميع الحالات</option>
    <option>معتمدة</option>
    <option>قيد المراجعة</option>
    <option>مرفوضة</option>
  </select>
</div>

<!-- الأدلة -->
<div class="cards">

<div class="card">
  <h4>خطة قسم الرياضيات</h4>
  <p>خطة الفصل الدراسي الأول</p>
  <div class="status approved">✔ معتمدة</div>
  <div class="actions">
    <button class="view">عرض</button>
    <button class="review">مراجعة</button>
    <button class="edit">تعديل</button>
    <button class="delete">حذف</button>
  </div>
</div>

<div class="card">
  <h4>خطة قسم العلوم</h4>
  <p>تقارير المختبرات</p>
  <div class="status pending">⏳ قيد المراجعة</div>
  <div class="actions">
    <button class="view">عرض</button>
    <button class="review">مراجعة</button>
    <button class="edit">تعديل</button>
    <button class="delete">حذف</button>
  </div>
</div>

<div class="card">
  <h4>ابتكارات الطلبة</h4>
  <p>مشاريع STEM</p>
  <div class="status rejected">✖ مرفوضة</div>
  <div class="actions">
    <button class="view">عرض</button>
    <button class="review">مراجعة</button>
    <button class="edit">تعديل</button>
    <button class="delete">حذف</button>
  </div>
</div>

</div>

</div>

</body>
</html>
