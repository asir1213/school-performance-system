<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بَصيرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --main:#0d47a1;
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#1f2937;
  --approved:#2e7d32;
  --pending:#f9a825;
  --rejected:#c62828;
}
body.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#e5e7eb;
}

*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}

.topbar{
  height:70px;background:var(--main);color:#fff;
  display:flex;align-items:center;justify-content:center;
  position:relative;font-size:26px;font-weight:700;
}
.topbar .actions{position:absolute;left:20px;display:flex;gap:10px}
.topbar button{
  background:#ffffff22;border:none;color:#fff;
  padding:6px 12px;border-radius:6px;cursor:pointer
}

.layout{display:flex}
.sidebar{
  width:260px;background:#0b3c91;
  min-height:calc(100vh - 70px);padding-top:15px
}
.sidebar a{
  display:flex;gap:10px;align-items:center;
  padding:14px 20px;color:#fff;text-decoration:none;
  cursor:pointer;font-size:16px
}
.sidebar a.active,.sidebar a:hover{
  background:#1565c0;border-right:5px solid #ffeb3b
}

.content{flex:1;padding:30px}
.section{display:none}
.section.active{display:block}

.card{
  background:var(--card);
  border-radius:14px;
  padding:20px;
  margin-bottom:20px
}

/* الأدلة */
.dept-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.dept-card{background:var(--card);padding:15px;border-radius:12px;text-align:center}
.dept-card button{
  margin-top:10px;background:var(--main);color:#fff;
  border:none;padding:6px 12px;border-radius:6px;cursor:pointer
}

.evidence-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.evidence-card{background:var(--card);padding:15px;border-radius:12px}
.status{font-weight:700}
.pending{color:var(--pending)}

/* رفع الدليل */
.upload-form input,.upload-form select,.upload-form textarea{
  width:100%;padding:10px;margin-bottom:12px;
  border-radius:6px;border:1px solid #ccc
}
.drop-zone{
  border:2px dashed #999;
  padding:20px;text-align:center;border-radius:10px;
  margin-bottom:15px
}
</style>
</head>

<body>

<div class="topbar">
  بَصيرة
  <div class="actions">
    <button onclick="toggleMode()">🌙</button>
  </div>
</div>

<div class="layout">

<div class="sidebar">
  <a class="active" onclick="showSection('home',this)">🏠 الرئيسية</a>
  <a onclick="showSection('evidence',this)">📁 الأدلة</a>
  <a onclick="showSection('upload',this)">⬆️ رفع دليل</a>
  <a onclick="showSection('reports',this)">📊 التقارير</a>
  <a onclick="showSection('ai',this)">🤖 المساعد الذكي</a>
</div>

<div class="content">

<div id="home" class="section active">
  <div class="card center">
    <h1>بَصيرة</h1>
    <h3>مدرسة بحر عمان للتعليم الأساسي (1–12)</h3>
    <p>نظام رقمي لإدارة وتقويم الأدلة المدرسية.</p>
  </div>
</div>

<div id="evidence" class="section">
  <h2>الأدلة المدرسية</h2>
  <div class="evidence-grid" id="evidenceGrid"></div>
</div>

<div id="upload" class="section">
  <h2>رفع دليل</h2>
  <div class="card upload-form">
    <input id="title" placeholder="عنوان الدليل">
    <textarea id="desc" placeholder="وصف الدليل"></textarea>

    <select id="dept"></select>

    <div class="drop-zone">
      اسحب الملف هنا أو اختر ملفًا
      <input type="file">
    </div>

    <button onclick="saveEvidence()">حفظ الدليل</button>
  </div>
</div>

<div id="reports" class="section"><h2>التقارير</h2></div>
<div id="ai" class="section"><h2>المساعد الذكي</h2></div>

</div>
</div>

<script>
function showSection(id,el){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
  el.classList.add('active');
}
function toggleMode(){document.body.classList.toggle('dark')}

const departments=[
"الرياضيات","العلوم","اللغة العربية","اللغة الإنجليزية",
"التربية الإسلامية","الدراسات الاجتماعية","المختبرات",
"الموسيقى","الفنون","الابتكار وريادة الأعمال"
];

const deptSelect=document.getElementById("dept");
departments.forEach(d=>deptSelect.add(new Option(d,d)));

let evidences=[];

function saveEvidence(){
  evidences.push({
    title:title.value,
    desc:desc.value,
    dept:dept.value,
    status:"قيد المراجعة"
  });
  renderEvidence();
  alert("تم حفظ الدليل");
}

function renderEvidence(){
  evidenceGrid.innerHTML="";
  evidences.forEach(e=>{
    evidenceGrid.innerHTML+=`
    <div class="evidence-card">
      <h4>${e.title}</h4>
      <p>${e.desc}</p>
      <small>${e.dept}</small><br>
      <span class="status pending">${e.status}</span>
    </div>`;
  });
}
</script>

</body>
</html>
